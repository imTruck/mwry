<svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF59D" />
            <stop offset="35%" stop-color="#FFD700" />
            <stop offset="70%" stop-color="#DAA520" />
            <stop offset="100%" stop-color="#B8860B" />
        </linearGradient>
        <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF9C4" />
            <stop offset="40%" stop-color="#FFD54F" />
            <stop offset="100%" stop-color="#FFA000" />
        </linearGradient>
        <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F8FAFC" />
            <stop offset="60%" stop-color="#CBD5E1" />
            <stop offset="100%" stop-color="#94A3B8" />
        </linearGradient>
    </defs>

    <!-- Sun Rays (20 radiant beams) -->
    <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
        <line x1="100" y1="32" x2="100" y2="14" />
        <line x1="120" y1="36" x2="128" y2="20" />
        <line x1="138" y1="48" x2="152" y2="36" />
        <line x1="150" y1="65" x2="168" y2="58" />
        <line x1="156" y1="85" x2="176" y2="82" />
        <line x1="154" y1="105" x2="174" y2="108" />
        <line x1="144" y1="124" x2="162" y2="132" />
        <line x1="80" y1="36" x2="72" y2="20" />
        <line x1="62" y1="48" x2="48" y2="36" />
        <line x1="50" y1="65" x2="32" y2="58" />
        <line x1="44" y1="85" x2="24" y2="82" />
        <line x1="46" y1="105" x2="26" y2="108" />
        <line x1="56" y1="124" x2="38" y2="132" />
        <!-- Alternate intermediate rays -->
        <line x1="110" y1="33" x2="114" y2="22" stroke-width="1.8" />
        <line x1="129" y1="41" x2="139" y2="30" stroke-width="1.8" />
        <line x1="145" y1="56" x2="160" y2="48" stroke-width="1.8" />
        <line x1="90" y1="33" x2="86" y2="22" stroke-width="1.8" />
        <line x1="71" y1="41" x2="61" y2="30" stroke-width="1.8" />
        <line x1="55" y1="56" x2="40" y2="48" stroke-width="1.8" />
    </g>

    <!-- Sun Disk -->
    <circle cx="100" cy="72" r="32" fill="url(#sunGrad)" stroke="#DAA520" stroke-width="1.5" />

    <!-- Sun Face Features -->
    <g fill="#6D4C41">
        <!-- Eyebrows & Eyes -->
        <path d="M88 64 Q92 61 96 64" stroke="#6D4C41" stroke-width="1.2" fill="none" stroke-linecap="round" />
        <path d="M104 64 Q108 61 112 64" stroke="#6D4C41" stroke-width="1.2" fill="none" stroke-linecap="round" />
        <ellipse cx="92" cy="67" rx="2.5" ry="1.8" />
        <ellipse cx="108" cy="67" rx="2.5" ry="1.8" />
        <!-- Nose -->
        <path d="M100 66 L98 74 L102 74 Z" />
        <!-- Serene Smile -->
        <path d="M93 78 Q100 84 107 78" stroke="#6D4C41" stroke-width="1.6" fill="none" stroke-linecap="round" />
    </g>

    <!-- Persian Lion Body -->
    <!-- Mane -->
    <path d="M78 88 C70 95 68 115 76 128 C80 135 88 140 100 142 C112 140 120 135 124 128 C132 115 130 95 122 88 C116 82 108 80 100 80 C92 80 84 82 78 88 Z" fill="#B8860B" />

    <!-- Lion Head -->
    <circle cx="100" cy="104" r="18" fill="url(#goldGrad)" />
    
    <!-- Lion Ears -->
    <path d="M84 94 C82 88 88 84 92 89 Z" fill="#DAA520" />
    <path d="M116 94 C118 88 112 84 108 89 Z" fill="#DAA520" />

    <!-- Lion Eyes & Muzzle -->
    <circle cx="93" cy="101" r="2.2" fill="#2C1810" />
    <circle cx="107" cy="101" r="2.2" fill="#2C1810" />
    <ellipse cx="100" cy="107" rx="3" ry="2.2" fill="#2C1810" />
    <path d="M96 110 Q100 114 104 110" stroke="#2C1810" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Lion Torso / Forelegs -->
    <path d="M85 120 Q100 126 115 120 L118 152 Q112 156 106 152 L104 134 L96 134 L94 152 Q88 156 82 152 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1" />

    <!-- Imperial Shamshir (Curved Saber) -->
    <!-- Curved Blade -->
    <path d="M130 90 Q145 120 136 158" stroke="url(#bladeGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M130 90 Q145 120 136 158" stroke="#FFFFFF" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.8" />
    
    <!-- Sword Guard (Crossguard) -->
    <line x1="124" y1="120" x2="142" y2="120" stroke="#FFD700" stroke-width="3" stroke-linecap="round" />
    <!-- Sword Pommel & Grip -->
    <circle cx="137" cy="162" r="3.2" fill="#FFD700" />
    <line x1="134" y1="148" x2="137" y2="162" stroke="#DAA520" stroke-width="3" stroke-linecap="round" />

    <!-- Flowing Tail -->
    <path d="M78 132 C60 136 54 118 62 108" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="62" cy="108" r="3.5" fill="#B8860B" />
</svg>
