<svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <clipPath id="circleClip">
            <circle cx="100" cy="100" r="99" />
        </clipPath>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF9C4" />
            <stop offset="30%" stop-color="#FFD700" />
            <stop offset="70%" stop-color="#DAA520" />
            <stop offset="100%" stop-color="#996515" />
        </linearGradient>
        <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF59D" />
            <stop offset="50%" stop-color="#FFCA28" />
            <stop offset="100%" stop-color="#FF8F00" />
        </linearGradient>
        <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="50%" stop-color="#ECEFF1" />
            <stop offset="100%" stop-color="#78909C" />
        </linearGradient>
        <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
        </filter>
    </defs>

    <!-- Tricolor Flag Clipped in Circle -->
    <g clip-path="url(#circleClip)">
        <!-- Green Stripe -->
        <rect x="0" y="0" width="200" height="66.6" fill="#239F40" />
        <!-- White Stripe -->
        <rect x="0" y="66.6" width="200" height="66.8" fill="#FFFFFF" />
        <!-- Red Stripe -->
        <rect x="0" y="133.3" width="200" height="66.7" fill="#DA0000" />

        <!-- Lion and Sun Emblem -->
        <g filter="url(#subtleShadow)">
            <!-- Sun Rays (Rising behind Lion) -->
            <g stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round">
                <line x1="100" y1="52" x2="100" y2="34" />
                <line x1="114" y1="55" x2="124" y2="40" />
                <line x1="127" y1="64" x2="142" y2="52" />
                <line x1="135" y1="76" x2="154" y2="70" />
                <line x1="138" y1="90" x2="160" y2="88" />
                <line x1="136" y1="104" x2="156" y2="108" />
                <line x1="86" y1="55" x2="76" y2="40" />
                <line x1="73" y1="64" x2="58" y2="52" />
                <line x1="65" y1="76" x2="46" y2="70" />
                <line x1="62" y1="90" x2="40" y2="88" />
                <line x1="64" y1="104" x2="44" y2="108" />
                <!-- Subtle alternate rays -->
                <line x1="107" y1="53" x2="112" y2="42" stroke-width="1.4" />
                <line x1="121" y1="59" x2="133" y2="46" stroke-width="1.4" />
                <line x1="131" y1="70" x2="148" y2="61" stroke-width="1.4" />
                <line x1="93" y1="53" x2="88" y2="42" stroke-width="1.4" />
                <line x1="79" y1="59" x2="67" y2="46" stroke-width="1.4" />
                <line x1="69" y1="70" x2="52" y2="61" stroke-width="1.4" />
            </g>

            <!-- Sun Disk -->
            <circle cx="100" cy="80" r="26" fill="url(#sunGrad)" stroke="#DAA520" stroke-width="1.2" />

            <!-- Sun Human Face Details -->
            <g fill="#5D4037">
                <path d="M90 73 Q94 70 97 73" stroke="#5D4037" stroke-width="1" fill="none" stroke-linecap="round" />
                <path d="M103 73 Q106 70 110 73" stroke="#5D4037" stroke-width="1" fill="none" stroke-linecap="round" />
                <ellipse cx="93" cy="76" rx="2" ry="1.4" />
                <ellipse cx="107" cy="76" rx="2" ry="1.4" />
                <path d="M100 75 L98 81 L102 81 Z" />
                <path d="M94 85 Q100 90 106 85" stroke="#5D4037" stroke-width="1.3" fill="none" stroke-linecap="round" />
            </g>

            <!-- Standing Lion Structure -->
            <!-- Mane Background -->
            <path d="M82 92 C74 98 72 114 78 124 C82 130 90 134 100 136 C110 134 118 130 122 124 C128 114 126 98 118 92 C113 87 107 85 100 85 C93 85 87 87 82 92 Z" fill="#996515" />

            <!-- Lion Head -->
            <circle cx="100" cy="105" r="15" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.8" />
            
            <!-- Lion Ears -->
            <path d="M87 96 C85 91 90 88 94 92 Z" fill="#DAA520" />
            <path d="M113 96 C115 91 110 88 106 92 Z" fill="#DAA520" />

            <!-- Lion Facial Features -->
            <circle cx="94" cy="103" r="1.8" fill="#1A0F00" />
            <circle cx="106" cy="103" r="1.8" fill="#1A0F00" />
            <ellipse cx="100" cy="108" rx="2.4" ry="1.8" fill="#1A0F00" />
            <path d="M97 111 Q100 114 103 111" stroke="#1A0F00" stroke-width="1.2" fill="none" stroke-linecap="round" />

            <!-- Lion Torso / Forelegs -->
            <path d="M88 118 Q100 123 112 118 L115 142 Q110 145 105 142 L103 129 L97 129 L95 142 Q90 145 85 142 Z" fill="url(#goldGrad)" stroke="#996515" stroke-width="0.9" />

            <!-- Royal Persian Shamshir (Sword) -->
            <!-- Curved Blade -->
            <path d="M125 94 Q138 118 130 148" stroke="url(#bladeGrad)" stroke-width="3" fill="none" stroke-linecap="round" />
            <path d="M125 94 Q138 118 130 148" stroke="#FFFFFF" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.9" />
            
            <!-- Crossguard -->
            <line x1="120" y1="118" x2="135" y2="118" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" />
            <!-- Pommel & Hilt -->
            <circle cx="131" cy="151" r="2.5" fill="#FFD700" />
            <line x1="128" y1="140" x2="131" y2="151" stroke="#B8860B" stroke-width="2.5" stroke-linecap="round" />

            <!-- Tail Curving majestically over back -->
            <path d="M82 128 C66 131 60 116 67 107" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <circle cx="67" cy="107" r="3" fill="#996515" />
        </g>
    </g>

    <!-- Outer Gold Ring -->
    <circle cx="100" cy="100" r="98.5" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
</svg>
